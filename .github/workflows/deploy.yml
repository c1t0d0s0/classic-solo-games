name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure GTM_ID from repository variable
        env:
          ENV_GTM_ID: ${{ vars.GTM_ID || secrets.GTM_ID }}
        run: |
          if [ -n "$ENV_GTM_ID" ]; then
            echo "Applying GTM_ID from repository variables..."
            cat << EOF > config.js
          const GTM_ID = '$ENV_GTM_ID';
          if (typeof window !== 'undefined') {
            window.GTM_ID = GTM_ID;
          }
          EOF
            mkdir -p public
            cp config.js public/config.js
          else
            echo "No repository GTM_ID variable provided; using default config.js."
          fi

      - name: Build project
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
